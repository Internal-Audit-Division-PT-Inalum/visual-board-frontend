# PT INDONESIA ASAHAN ALUMINIUM (INALUM) — DIVISI INTERNAL AUDIT
# Enterprise Security Headers & Content Security Policy (CSP) Configuration
# Cross-Stack Hardening Parity: Visual Board Kiosk & Portal Frontend
# ==============================================================================

# 1. Content Security Policy (CSP)
# - default-src: Same-origin default
# - script-src: 'self' only (no inline scripts or arbitrary external script execution)
# - style-src: 'self' and 'unsafe-inline' (Tailwind CSS v4 & Recharts inline styles)
# - img-src: 'self', inline data URIs, blobs, and HTTPS media/storage endpoints
# - font-src: 'self' (bundled @fontsource/plus-jakarta-sans assets)
# - connect-src: Same-origin API reverse proxy and corporate INALUM HTTPS domains
# - object-src: 'none' (disables plugin execution)
# - frame-ancestors: 'none' (Strict anti-clickjacking)
# - base-uri: 'self' (restricts <base> tag injection)
# - form-action: 'self' (prohibits cross-origin form submission)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://*.inalum.id; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# 2. Anti-Clickjacking Protection
add_header X-Frame-Options "DENY" always;

# 3. MIME-Type Sniffing Prevention
add_header X-Content-Type-Options "nosniff" always;

# 4. Referrer Leakage Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 5. Hardware Sensor & Feature Policy (Zero hardware permissions required for read-only board/kiosk)
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=(), display-capture=()" always;

# 6. HTTP Strict Transport Security (HSTS)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 7. Cross-Origin Isolation Protection
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
